{% extends 'base.html' %}

{% block content %}
<section class="mx-auto max-w-lg rounded-3xl border border-slate-200 bg-white p-7 shadow-lg dark:border-slate-700 dark:bg-slate-900 md:p-8">
    <h1 class="text-3xl font-black text-slate-900 dark:text-slate-100">Connexion</h1>
    <form method="POST" class="mt-4 space-y-4">
        <div>
            <label for="identifier" class="mb-2 block text-sm font-semibold">Nom d'utilisateur ou email</label>
            <input id="identifier" name="identifier" type="text" required autocomplete="username" placeholder="ex: leo_m ou leo@email.com" class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        </div>
        <div>
            <label for="password" class="mb-2 block text-sm font-semibold">Mot de passe</label>
            <input id="password" name="password" type="password" required class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        </div>
        <button type="submit" class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-base font-bold text-white dark:bg-cyan-600">Se connecter</button>
    </form>
</section>
{% endblock %}
