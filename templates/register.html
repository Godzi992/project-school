{% extends 'base.html' %}

{% block content %}
<section class="mx-auto max-w-lg rounded-3xl border border-slate-200 bg-white p-7 shadow-lg dark:border-slate-700 dark:bg-slate-900 md:p-8">
    <h1 class="text-3xl font-black text-slate-900 dark:text-slate-100">Inscription</h1>
    <form method="POST" class="mt-4 space-y-4">
        <div>
            <label for="username" class="mb-2 block text-sm font-semibold">Nom d'utilisateur</label>
            <input id="username" name="username" type="text" required class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        </div>
        <div>
            <label for="email" class="mb-2 block text-sm font-semibold">Email</label>
            <input id="email" name="email" type="email" required class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        </div>
        <div>
            <label for="password" class="mb-2 block text-sm font-semibold">Mot de passe</label>
            <input id="password" name="password" type="password" required class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        </div>
        <div>
            <label for="school_class" class="mb-2 block text-sm font-semibold">Classe</label>
            <select id="school_class" name="school_class" required class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
                {% for level in LEVELS %}
                    <option value="{{ level }}">{{ level }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="rounded-2xl bg-slate-100 px-4 py-3 text-sm text-slate-700 dark:bg-slate-800 dark:text-slate-200">
            Les comptes crees ici sont automatiquement en mode eleve.
        </div>
        <button type="submit" class="w-full rounded-2xl bg-cyan-600 px-4 py-3 text-base font-bold text-white">Creer le compte</button>
    </form>
</section>
{% endblock %}
